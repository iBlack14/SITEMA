<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMARC | Seguimiento Judicial Inteligente</title>
    <!-- Google Fonts: Outfit for titles, Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #D4AF37;
            --primary-dark: #C49A2D;
            --surface: #1A1A1A;
            --background: #0D0D0D;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.2);
            --success: #4CAF50;
            --info: #2196F3;
            --warning: #FF9800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: radial-gradient(circle at top right, rgba(212,175,55,0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(212,175,55,0.05), transparent);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 800;
            background: linear-gradient(135deg, #FFF 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Search Section - Refined Glassmorphism */
        .search-section {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            transition: all 0.4s ease;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .tab.active {
            color: var(--primary);
            background: rgba(212, 175, 55, 0.1);
        }

        .search-group {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 18px 24px;
            border-radius: 16px;
            color: #FFF;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .btn-search {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .btn-search:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        /* Results Display (CEJ Style) */
        .results-section {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            display: none;
        }

        .results-section.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .cej-view {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .cej-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .data-item {
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border-left: 3px solid var(--primary);
        }

        .data-item label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .data-item .value {
            font-size: 15px;
            font-weight: 500;
            color: #FFF;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #FFF;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-download:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* Timeline (Seguimiento) */
        .cej-timeline {
            position: relative;
            padding-left: 30px;
        }

        .cej-timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(212,175,55,0.2);
        }

        .timeline-entry {
            position: relative;
            margin-bottom: 32px;
        }

        .timeline-marker {
            position: absolute;
            left: -34px;
            top: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .entry-card {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .entry-date {
            color: var(--text-muted);
            font-size: 13px;
        }

        .entry-sumilla {
            color: #FFF;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .qr-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .qr-btn:hover {
            background: var(--primary);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Seguimiento Judicial</h1>
            <p>Acceso Seguro al Expediente Electrónico</p>
        </header>

        <section class="search-section">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('codigo')">Por Código</button>
                <button class="tab" onclick="switchTab('nombre')">Por Nombre</button>
            </div>

            <form id="search-form" onsubmit="buscarExpediente(event)">
                <div id="group-codigo" class="search-group">
                    <input type="text" id="codigo-mpv" class="search-input" placeholder="Ej: TMARC-0001-2025">
                </div>
                <div id="group-nombre" class="search-group" style="display:none">
                    <input type="text" id="razon" class="search-input" placeholder="Nombre completo o Razón Social">
                </div>
                
                <button type="submit" class="btn-search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    Consultar Expediente
                </button>
            </form>

            <div class="qr-section">
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">¿Tienes un código QR?</p>
                <input type="file" id="qr-input" accept="image/*" style="display:none" onchange="processQR(event)">
                <button class="qr-btn" onclick="document.getElementById('qr-input').click()">📸 Escanear QR desde Imagen</button>
                <div id="qr-result" style="margin-top: 10px; font-size: 12px;"></div>
            </div>
        </section>

        <div id="results-section" class="results-section">
            <!-- Dynamic content -->
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('group-codigo').style.display = type === 'codigo' ? 'block' : 'none';
            document.getElementById('group-nombre').style.display = type === 'nombre' ? 'block' : 'none';
        }

        async function buscarExpediente(event) {
            event.preventDefault();
            const results = document.getElementById('results-section');
            results.classList.add('show');
            results.innerHTML = '<div style="text-align:center; padding:50px">⏳ Buscando expediente...</div>';
            
            // Simulación de búsqueda (aquí iría el fetch real)
            setTimeout(() => {
                // Para efectos de demo, llamamos a buscarPorCodigo con el valor ingresado
                const val = document.getElementById('codigo-mpv').value || document.getElementById('razon').value;
                buscarPorCodigo(val);
            }, 800);
        }

        async function buscarPorCodigo(codigo) {
            try {
                const response = await fetch(`/api/seguimiento/${encodeURIComponent(codigo)}`);
                const data = await response.json();
                if (data.success) {
                    mostrarResultados(data.data);
                } else {
                    document.getElementById('results-section').innerHTML = '<div style="text-align:center; padding:50px">❌ Expediente no encontrado.</div>';
                }
            } catch (error) {
                console.error(error);
            }
        }

        const BADGE = {
            'Nuevo': '#d4af37', 'En Trámite': '#2196F3', 'En Procesamiento': '#9C27B0',
            'Completado': '#4CAF50', 'Archivado': '#607D8B',
            'Pendiente': '#FF9800', 'Aprobado': '#4CAF50', 'Rechazado': '#f44336',
            'NOTA': '#607D8B', 'OFICIO': '#1565C0', 'RESOLUCION': '#6A1B9A',
            'AUTO': '#AD1457', 'DECRETO': '#00838F', 'SENTENCIA': '#1B5E20', 'OTRO': '#37474F'
        };

        function badge(txt, color) {
            return `<span class="status-badge" style="background:${color}15; color:${color}; border:1px solid ${color}30">${txt}</span>`;
        }

        // ── MOSTRAR RESULTADOS (vista CEJ completa - PRO MAX) ───────────────────────────
        function mostrarResultados(data) {
            const rs = document.getElementById('results-section');
            rs.className = 'results-section show';
            
            const exp    = data.datos_generales || data;
            const partes = data.partes_procesales || [];
            const actos  = data.actos_procesales || [];
            const docs   = data.documentos || [];
            const fuente = data.fuente || 'expediente';

            const fmtF = (f) => f ? new Date(f).toLocaleDateString('es-PE') : '—';
            const fmtFH = (f) => f ? new Date(f).toLocaleString('es-PE') : '—';

            // 1. DATOS GENERALES
            let htmlGen = `
            <div class="cej-view">
                <div class="section-card">
                    <div class="section-title">
                        <svg viewBox="0 0 24 24"><path d="M13 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9l-7-7zM6 20V4h6v5h5v11H6z"/></svg>
                        Datos Generales del Proceso
                    </div>
                    <div class="cej-grid">
                        <div class="data-item">
                            <label>Expediente</label>
                            <div class="value" style="color:var(--primary); font-size:18px">${exp.codigo || exp.numero || '—'}</div>
                        </div>
                        <div class="data-item">
                            <label>Estado</label>
                            <div class="value">${badge(exp.estado || 'EN TRÁMITE', BADGE[exp.estado] || '#888')}</div>
                        </div>
                        <div class="data-item">
                            <label>Fecha Inicio</label>
                            <div class="value">${fmtF(exp.fecha_inicio || exp.fecha_creacion)}</div>
                        </div>
                        <div class="data-item">
                            <label>Materia</label>
                            <div class="value">${exp.materia || 'ARBITRAJE'}</div>
                        </div>
                        <div class="data-item">
                            <label>Juez / Árbitro</label>
                            <div class="value">${exp.juez || 'POR ASIGNAR'}</div>
                        </div>
                        <div class="data-item">
                            <label>Ubicación</label>
                            <div class="value">${exp.ubicacion || 'SEDE CENTRAL'}</div>
                        </div>
                    </div>
                </div>`;

            // 2. PARTES PROCESALES
            if (partes.length > 0) {
                htmlGen += `
                <div class="section-card">
                    <div class="section-title">
                        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                        Partes Procesales
                    </div>
                    <div style="overflow-x:auto">
                        <table style="width:100%; border-collapse:collapse; font-size:14px">
                            <thead>
                                <tr style="border-bottom:1px solid rgba(255,255,255,0.1); text-align:left">
                                    <th style="padding:12px; color:var(--text-muted)">Parte</th>
                                    <th style="padding:12px; color:var(--text-muted)">Nombres / Razón Social</th>
                                    <th style="padding:12px; color:var(--text-muted)">Documento</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${partes.map(p => `
                                <tr style="border-bottom:1px solid rgba(255,255,255,0.03)">
                                    <td style="padding:12px; font-weight:600">${p.tipo_parte || 'PARTE'}</td>
                                    <td style="padding:12px">${p.razon_social || p.nombre || '—'}</td>
                                    <td style="padding:12px; font-family:monospace; color:var(--primary)">${p.dni || p.ruc || p.documento_identidad || '—'}</td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }

            // 3. DOCUMENTOS
            if (docs.length > 0) {
                htmlGen += `
                <div class="section-card">
                    <div class="section-title">
                        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.31 2.69 6 6 6s6-2.69 6-6V6h-1.5z"/></svg>
                        Expediente Digital
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:12px">
                        ${docs.map(d => `
                        <a href="/api/download/archivo/${d.nombre_archivo}" target="_blank" class="btn-download">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                            ${d.nombre_original || 'Ver Documento'}
                        </a>`).join('')}
                    </div>
                </div>`;
            }

            // 4. TIMELINE
            let htmlActos = '';
            if (actos.length > 0) {
                htmlActos = `
                <div class="section-card">
                    <div class="section-title">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm3.3 14.71L11 12.41V7h2v4.59l3.71 3.71-1.42 1.41z"/></svg>
                        Seguimiento Procesal
                    </div>
                    <div class="cej-timeline">`;

                actos.forEach(acto => {
                    const color = BADGE[acto.tipo_acto] || '#607D8B';
                    htmlActos += `
                    <div class="timeline-entry">
                        <div class="timeline-marker"></div>
                        <div class="entry-card">
                            <div class="entry-header">
                                <span class="entry-date">${fmtFH(acto.fecha_ingreso)}</span>
                                ${badge(acto.tipo_acto || 'ACTO', color)}
                            </div>
                            <div class="entry-sumilla">${acto.sumilla || 'Sin Sumilla'}</div>
                            <div class="entry-details">
                                <p>${acto.descripcion_usuario || ''}</p>
                            </div>
                            ${acto.tiene_documento ? `
                            <a href="/api/download/archivo/${acto.documento_archivo}" target="_blank" class="btn-download">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                                Descargar Resolución
                            </a>` : ''}
                        </div>
                    </div>`;
                });
                htmlActos += `</div></div>`;
            }

            htmlGen += htmlActos + `</div>`;
            rs.innerHTML = htmlGen;
        }

        function mostrarMultiplesResultados(exps) {
            const rs = document.getElementById('results-section');
            rs.className = 'results-section show';
            rs.innerHTML = `
            <div class="section-card">
                <div class="section-title">Coincidencias Encontradas</div>
                <div style="display:grid; gap:12px">
                    ${exps.map(e => `
                    <div class="entry-card" style="cursor:pointer" onclick="buscarPorCodigo('${e.numero_registro}')">
                        <div style="color:var(--primary); font-weight:700">${e.numero_registro}</div>
                        <div style="font-size:13px; color:#FFF">${e.demandante?.nombre || e.razon_social || '—'}</div>
                    </div>`).join('')}
                </div>
            </div>`;
        }
    </script>
</body>
</html>
