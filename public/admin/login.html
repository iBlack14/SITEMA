<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="../../favicon.png">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sistema de Mesa de Partes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('../../assets/img/login.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Overlay oscuro con gradiente dorado */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.75) 0%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 2px solid #d4af37;
            box-shadow: 0 25px 70px rgba(212, 175, 55, 0.4), 0 0 20px rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            padding: 45px 40px;
            text-align: center;
            color: #C0C0C0;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid #d4af37;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            animation: adminPulse 4s ease-in-out infinite;
        }

        @keyframes adminPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37 0%, #c49a2d 100%);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            animation: badgePulse 2s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.7); }
        }

        .login-header h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .login-form {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: #333333;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            color: #000000;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #d4af37;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .form-input::placeholder {
            color: #999999;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #d4af37 0%, #c49a2d 100%);
            border: 2px solid #e5c158;
            border-radius: 10px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4), 0 0 20px rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.6), 0 0 30px rgba(212, 175, 55, 0.4);
            background: linear-gradient(135deg, #e5c158 0%, #d4af37 100%);
            border-color: #f0d06f;
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.5);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #f44336;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #4caf50;
            font-size: 14px;
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            border-radius: 8px;
        }

        .back-link a:hover {
            color: #e5c158;
            background: rgba(212, 175, 55, 0.15);
            transform: translateX(-3px);
        }

        .security-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 13px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                max-width: none;
            }

            .login-header {
                padding: 30px 25px;
            }

            .login-form {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="admin-badge">🔐 Administrador</div>
            <h1>Panel de Administración</h1>
            <p>Sistema de Mesa de Partes Virtual</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="security-notice">
                🔒 Acceso restringido solo para administradores
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div class="form-group">
                <label class="form-label" for="username">Usuario Administrador</label>
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="Ingrese su usuario de administrador"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="Ingrese su contraseña"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                Acceder al Panel
            </button>

            <div class="back-link">
                <a href="../../login.html">← Volver al login de usuarios</a>
            </div>
        </form>
    </div>

    <script>
        // Sistema de autenticación para administradores
        class AdminAuthSystem {
            constructor() {
                this.init();
            }

            init() {
                // Verificar si ya hay una sesión activa
                const token = sessionStorage.getItem('authToken');
                const userData = sessionStorage.getItem('userData');

                if (token && userData) {
                    try {
                        const user = JSON.parse(userData);
                        
                        // Si es admin y ya tiene sesión, redirigir al dashboard
                        if (user.tipo === 'admin') {
                            console.log('✅ Sesión de admin activa, redirigiendo...');
                            window.location.href = '/public/admin/index.html';
                        } else {
                            // Si no es admin, limpiar sesión
                            this.limpiarSesion();
                        }
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                        this.limpiarSesion();
                    }
                }
            }

            async login(username, password) {
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usernameOEmail: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        const usuario = data.data.usuario;
                        const token = data.data.token;

                        // Verificar que sea administrador
                        if (usuario.tipo !== 'admin') {
                            return {
                                success: false,
                                message: '⚠️ Acceso denegado. Solo administradores pueden acceder a este panel.'
                            };
                        }

                        // Guardar sesión
                        sessionStorage.setItem('authToken', token);
                        sessionStorage.setItem('userData', JSON.stringify(usuario));
                        sessionStorage.setItem('userId', usuario.id.toString());
                        sessionStorage.setItem('user', JSON.stringify(usuario));

                        console.log('✅ Login de admin exitoso - Usuario:', usuario.nombre);

                        return {
                            success: true,
                            message: '¡Bienvenido, ' + usuario.nombre + '!',
                            usuario: usuario
                        };
                    } else {
                        return {
                            success: false,
                            message: data.error || 'Error de autenticación'
                        };
                    }
                } catch (error) {
                    console.error('Error en login:', error);
                    return {
                        success: false,
                        message: 'Error de conexión. Intente nuevamente.'
                    };
                }
            }

            limpiarSesion() {
                sessionStorage.removeItem('authToken');
                sessionStorage.removeItem('userData');
                sessionStorage.removeItem('userId');
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('usuarioActual');
                console.log('✅ Sesión limpiada');
            }

            mostrarMensaje(tipo, mensaje) {
                const errorDiv = document.getElementById('errorMessage');
                const successDiv = document.getElementById('successMessage');

                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';

                if (tipo === 'error') {
                    errorDiv.textContent = mensaje;
                    errorDiv.style.display = 'block';
                } else if (tipo === 'success') {
                    successDiv.textContent = mensaje;
                    successDiv.style.display = 'block';
                }
            }
        }

        // Instancia global
        const adminAuth = new AdminAuthSystem();

        // Manejar el envío del formulario
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // Validación básica
            if (!username || !password) {
                adminAuth.mostrarMensaje('error', 'Por favor, complete todos los campos.');
                return;
            }

            // Mostrar loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span>Verificando credenciales...';

            try {
                const resultado = await adminAuth.login(username, password);

                if (resultado.success) {
                    adminAuth.mostrarMensaje('success', resultado.message);
                    setTimeout(() => {
                        window.location.href = '/public/admin/index.html';
                    }, 1000);
                } else {
                    adminAuth.mostrarMensaje('error', resultado.message);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Acceder al Panel';
                }
            } catch (error) {
                console.error('Error en login:', error);
                adminAuth.mostrarMensaje('error', 'Error de conexión. Intente nuevamente.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Acceder al Panel';
            }
        });
    </script>
</body>
</html>
