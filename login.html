<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMARC | Acceso Judicial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #C9A96E;
            --primary-hover: #D4B578;
            --primary-dark: #B8975F;
            --surface: #FFFFFF;
            --background: #FAFBFC;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;
            --glass: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(15, 23, 42, 0.08);
            --error: #DC2626;
            --success: #059669;
            --shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #F1F5F9 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Enhanced Background */
        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.7) blur(1px);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(201, 169, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(201, 169, 110, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, rgba(250, 251, 252, 0.9) 0%, rgba(241, 245, 249, 0.95) 100%);
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: fadeInScale 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-hover) 100%);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .login-header {
            padding: 48px 40px 24px;
            text-align: center;
        }

        .login-header .logo-area {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(201, 169, 110, 0.25);
        }

        .login-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .login-form {
            padding: 0 48px 48px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-light);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(201, 169, 110, 0.3);
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 169, 110, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .form-footer a:hover {
            color: var(--primary);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            margin: 20px 0;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
            border: 1px solid transparent;
        }

        .alert-error {
            background: rgba(220, 38, 38, 0.1);
            border-color: rgba(220, 38, 38, 0.2);
            color: var(--error);
        }

        .alert-success {
            background: rgba(5, 150, 105, 0.1);
            border-color: rgba(5, 150, 105, 0.2);
            color: var(--success);
        }

        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                border-radius: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="bg-overlay"></div>
    <img src="assets/img/login.png" class="bg-img" alt="Background">

    <div class="login-container">
        <div class="login-header">
            <div class="logo-area">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="white">
                    <path
                        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                </svg>
            </div>
            <h1>Acceso Judicial</h1>
            <p>Mesa de Partes Virtual TMARC</p>
        </div>

        <form id="loginForm" class="login-form">
            <div id="errorMessage" class="alert alert-error"></div>
            <div id="successMessage" class="alert alert-success"></div>

            <div class="form-group">
                <label class="form-label" for="username">Usuario o Email</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input" placeholder="nombre@correo.com" required
                        autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span>INICIAR SESIÓN</span>
            </button>

            <div class="form-footer">
                <a href="#" onclick="forgotPassword()">¿Olvidaste tu contraseña?</a>
                <div class="divider"></div>
                <a href="nueva-solicitud.html" style="font-weight: 600; color: var(--primary)">¿No tienes cuenta?
                    Regístrate aquí</a>
            </div>
        </form>

    </div>

    <!-- Script de conexión de datos -->
    <script src="conexion-datos.js"></script>

    <script>
        // Sistema de autenticación usando API backend
        class AuthSystem {
            constructor() {
                this.init();
            }

            init() {
                // Capturar parámetros de URL (Professional Redirect)
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                const codigo = urlParams.get('codigo');

                if (redirect) sessionStorage.setItem('redirectAfterLogin', redirect);
                if (codigo) sessionStorage.setItem('codigoPendiente', codigo);

                // Verificar si ya hay una sesión activa
                const token = sessionStorage.getItem('authToken');
                const userId = sessionStorage.getItem('userId');
                const userData = sessionStorage.getItem('user');

                if (token && userId && userData) {
                    try {
                        const user = JSON.parse(userData);
                        this.usuarioActual = user;
                        this.token = token;

                        // Verificar que el ID coincida
                        if (user.id.toString() === userId) {
                            console.log('✅ Sesión activa detectada, redirigiendo...');
                            this.redirigirDashboard(user);
                        } else {
                            console.warn('⚠️ ID de usuario no coincide, limpiando sesión');
                            this.limpiarSesion();
                        }
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                        this.limpiarSesion();
                    }
                }
            }

            async login(username, password) {
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usernameOEmail: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        const usuario = data.data.usuario;
                        const token = data.data.token;

                        // ✅ GUARDAR CON LAS CLAVES CORRECTAS que usa el dashboard
                        sessionStorage.setItem('authToken', token);
                        sessionStorage.setItem('userId', usuario.id.toString());
                        sessionStorage.setItem('user', JSON.stringify(usuario));

                        // También mantener userData para compatibilidad
                        sessionStorage.setItem('userData', JSON.stringify(usuario));

                        this.token = token;
                        this.usuarioActual = usuario;

                        console.log('✅ Login exitoso - Usuario:', usuario.nombre, 'ID:', usuario.id);

                        return {
                            success: true,
                            message: data.message,
                            usuario: usuario
                        };
                    } else {
                        return {
                            success: false,
                            message: data.error || 'Error de autenticación'
                        };
                    }
                } catch (error) {
                    console.error('Error en login:', error);
                    return {
                        success: false,
                        message: 'Error de conexión. Intente nuevamente.'
                    };
                }
            }

            logout() {
                this.limpiarSesion();
                window.location.href = 'login.html';
            }

            limpiarSesion() {
                // Limpiar TODAS las claves relacionadas con la sesión
                sessionStorage.removeItem('authToken');
                sessionStorage.removeItem('userId');
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('userData');
                sessionStorage.removeItem('usuarioActual');

                this.token = null;
                this.usuarioActual = null;

                console.log('✅ Sesión limpiada completamente');
            }

            redirigirDashboard(user) {
                if (user) {
                    console.log('🔄 Redirigiendo al dashboard para:', user.tipo);

                    // Verificar si hay código pendiente de seguimiento
                    const codigoPendiente = sessionStorage.getItem('codigoPendiente');

                    if (codigoPendiente) {
                        // Limpiar flags y redirigir a seguimiento con el código
                        sessionStorage.removeItem('codigoPendiente');
                        sessionStorage.removeItem('redirectAfterLogin');
                        sessionStorage.removeItem('loginRedirect');
                        window.location.href = `seguimiento.html?codigo=${encodeURIComponent(codigoPendiente)}`;
                        return;
                    }

                    // Verificar si debe redirigir a seguimiento (desde index.html)
                    const redirectAfterLogin = sessionStorage.getItem('redirectAfterLogin');

                    if (redirectAfterLogin === 'seguimiento') {
                        sessionStorage.removeItem('redirectAfterLogin');
                        sessionStorage.removeItem('loginRedirect');
                        window.location.href = 'seguimiento.html';
                        return;
                    }

                    // Limpiar flag de bucle
                    sessionStorage.removeItem('loginRedirect');

                    // Redirección normal según tipo de usuario
                    if (user.tipo === 'admin') {
                        window.location.href = 'public/admin/index.html';
                    } else {
                        window.location.href = 'dashboard-modular.html';
                    }
                }
            }

            mostrarMensaje(tipo, mensaje) {
                const errorDiv = document.getElementById('errorMessage');
                const successDiv = document.getElementById('successMessage');

                // Ocultar ambos mensajes
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';

                if (tipo === 'error') {
                    errorDiv.textContent = mensaje;
                    errorDiv.style.display = 'block';
                } else if (tipo === 'success') {
                    successDiv.textContent = mensaje;
                    successDiv.style.display = 'block';
                }
            }
        }

        // Instancia global del sistema de autenticación
        const authSystem = new AuthSystem();

        // Manejar el envío del formulario de login
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // Validación básica
            if (!username || !password) {
                authSystem.mostrarMensaje('error', 'Por favor, complete todos los campos.');
                return;
            }

            // Mostrar loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<div class="loading-spinner"></div><span>ENTRANDO...</span>';

            try {
                const resultado = await authSystem.login(username, password);

                if (resultado.success) {
                    authSystem.mostrarMensaje('success', resultado.message);
                    setTimeout(() => {
                        authSystem.redirigirDashboard(resultado.usuario);
                    }, 1000);
                } else {
                    authSystem.mostrarMensaje('error', resultado.message);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>INICIAR SESIÓN</span>';
                }
            } catch (error) {
                console.error('Error en login:', error);
                authSystem.mostrarMensaje('error', 'Error de conexión. Intente nuevamente.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>INICIAR SESIÓN</span>';
            }
        });

        // Función para recuperar contraseña
        function forgotPassword() {
            window.location.href = 'recuperar-password.html';
        }

        // Función global para logout (usada desde otros archivos)
        window.logout = function () {
            authSystem.logout();
        };
    </script>
</body>

</html>
