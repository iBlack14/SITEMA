<!DOCTYPE html>
<html lang="es">
<head>
    
    <link rel="icon" type="image/png" href="favicon.png">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Mesa de Partes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('assets/img/login.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Overlay oscuro para mejorar legibilidad */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 35px 40px;
            text-align: center;
            color: #C0C0C0;
            position: relative;
            overflow: hidden;
            border-bottom: 3px solid #d4af37;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .login-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .login-form {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: #333333;
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 8px;
            color: #000000;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .form-input::placeholder {
            color: #999999;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            border: 2px solid #d4af37;
            border-radius: 8px;
            color: #C0C0C0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            border-color: #e5c158;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            color: #d4af37;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #999999;
            font-size: 14px;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #cccccc;
        }

        .divider span {
            background: #ffffff;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: black;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .register-link a:hover {
            color: #A0A0A0;
            text-decoration: underline;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #f44336;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #4caf50;
            font-size: 14px;
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: #C0C0C0;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: #333333;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
        }

        .forgot-password a:hover {
            color: #C0C0C0;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                max-width: none;
            }

            .login-header {
                padding: 25px 30px;
            }

            .login-form {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Acceso al Sistema</h1>
            <p>Mesa de Partes Virtual</p>
        </div>

        <form id="loginForm" class="login-form">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="Ingrese su usuario"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="Ingrese su contraseña"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                Iniciar Sesión
            </button>

            <div class="forgot-password">
                <a href="#" onclick="forgotPassword()">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="divider">
                <span>o</span>
            </div>

            <div class="register-link">
                <a href="nueva-solicitud.html">¿No tienes cuenta? Regístrate aquí</a>
            </div>
        </form>
    </div>

    <!-- Script de conexión de datos -->
    <script src="conexion-datos.js"></script>

    <script>
        // Sistema de autenticación usando API backend
        class AuthSystem {
            constructor() {
                this.init();
            }

            init() {
                // Verificar si ya hay una sesión activa (token en sessionStorage)
                const token = sessionStorage.getItem('authToken');
                const userId = sessionStorage.getItem('userId');
                const userData = sessionStorage.getItem('user');

                if (token && userId && userData) {
                    try {
                        const user = JSON.parse(userData);
                        this.usuarioActual = user;
                        this.token = token;
                        
                        // Verificar que el ID coincida
                        if (user.id.toString() === userId) {
                            console.log('✅ Sesión activa detectada, redirigiendo...');
                            this.redirigirDashboard(user);
                        } else {
                            console.warn('⚠️ ID de usuario no coincide, limpiando sesión');
                            this.limpiarSesion();
                        }
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                        this.limpiarSesion();
                    }
                }
            }

            async login(username, password) {
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usernameOEmail: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        const usuario = data.data.usuario;
                        const token = data.data.token;

                        // ✅ GUARDAR CON LAS CLAVES CORRECTAS que usa el dashboard
                        sessionStorage.setItem('authToken', token);
                        sessionStorage.setItem('userId', usuario.id.toString());
                        sessionStorage.setItem('user', JSON.stringify(usuario));
                        
                        // También mantener userData para compatibilidad
                        sessionStorage.setItem('userData', JSON.stringify(usuario));

                        this.token = token;
                        this.usuarioActual = usuario;

                        console.log('✅ Login exitoso - Usuario:', usuario.nombre, 'ID:', usuario.id);

                        return {
                            success: true,
                            message: data.message,
                            usuario: usuario
                        };
                    } else {
                        return {
                            success: false,
                            message: data.error || 'Error de autenticación'
                        };
                    }
                } catch (error) {
                    console.error('Error en login:', error);
                    return {
                        success: false,
                        message: 'Error de conexión. Intente nuevamente.'
                    };
                }
            }

            logout() {
                this.limpiarSesion();
                window.location.href = 'login.html';
            }

            limpiarSesion() {
                // Limpiar TODAS las claves relacionadas con la sesión
                sessionStorage.removeItem('authToken');
                sessionStorage.removeItem('userId');
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('userData');
                sessionStorage.removeItem('usuarioActual');
                
                this.token = null;
                this.usuarioActual = null;
                
                console.log('✅ Sesión limpiada completamente');
            }

            redirigirDashboard(user) {
                if (user) {
                    console.log('🔄 Redirigiendo al dashboard para:', user.tipo);
                    
                    // Verificar si hay código pendiente de seguimiento
                    const codigoPendiente = sessionStorage.getItem('codigoPendiente');
                    
                    if (codigoPendiente) {
                        // Limpiar flags y redirigir a seguimiento con el código
                        sessionStorage.removeItem('codigoPendiente');
                        sessionStorage.removeItem('loginRedirect'); // Limpiar flag de bucle
                        window.location.href = `seguimiento.html?codigo=${codigoPendiente}`;
                        return;
                    }
                    
                    // Verificar si debe redirigir a seguimiento (desde index.html)
                    const redirectAfterLogin = sessionStorage.getItem('redirectAfterLogin');
                    
                    if (redirectAfterLogin === 'seguimiento') {
                        sessionStorage.removeItem('redirectAfterLogin');
                        sessionStorage.removeItem('loginRedirect');
                        window.location.href = 'seguimiento.html';
                        return;
                    }
                    
                    // Limpiar flag de bucle
                    sessionStorage.removeItem('loginRedirect');
                    
                    // Redirección normal según tipo de usuario
                    if (user.tipo === 'admin') {
                        window.location.href = 'public/admin/index.html';
                    } else {
                        window.location.href = 'dashboard-modular.html';
                    }
                }
            }

            mostrarMensaje(tipo, mensaje) {
                const errorDiv = document.getElementById('errorMessage');
                const successDiv = document.getElementById('successMessage');

                // Ocultar ambos mensajes
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';

                if (tipo === 'error') {
                    errorDiv.textContent = mensaje;
                    errorDiv.style.display = 'block';
                } else if (tipo === 'success') {
                    successDiv.textContent = mensaje;
                    successDiv.style.display = 'block';
                }
            }
        }

        // Instancia global del sistema de autenticación
        const authSystem = new AuthSystem();

        // Manejar el envío del formulario de login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // Validación básica
            if (!username || !password) {
                authSystem.mostrarMensaje('error', 'Por favor, complete todos los campos.');
                return;
            }

            // Mostrar loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span>Iniciando sesión...';

            try {
                const resultado = await authSystem.login(username, password);

                if (resultado.success) {
                    authSystem.mostrarMensaje('success', resultado.message);
                    setTimeout(() => {
                        authSystem.redirigirDashboard(resultado.usuario);
                    }, 1000);
                } else {
                    authSystem.mostrarMensaje('error', resultado.message);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Iniciar Sesión';
                }
            } catch (error) {
                console.error('Error en login:', error);
                authSystem.mostrarMensaje('error', 'Error de conexión. Intente nuevamente.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Iniciar Sesión';
            }
        });

        // Función para recuperar contraseña
        function forgotPassword() {
            window.location.href = 'recuperar-password.html';
        }

        // Función global para logout (usada desde otros archivos)
        window.logout = function() {
            authSystem.logout();
        };
    </script>
</body>
</html>
