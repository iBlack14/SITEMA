<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ TMARC | Sistema Judicial Institucional</title>

    <!-- UI-UX-PRO-MAX Engine -->
    <link rel="stylesheet" href="assets/css/base-premium.css?v=5.0">
    <link rel="stylesheet" href="assets/css/components-premium.css?v=5.0">
    <link rel="stylesheet" href="assets/css/modal-premium.css?v=5.0">
    <link rel="stylesheet" href="assets/css/tables-premium.css?v=5.0">

    <!-- External Libs -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="conexion-datos.js?v=5.0"></script>
</head>
<body class="pro-max-theme">
    
    <!-- Background Accents -->
    <div class="bg-glow"></div>

    <!-- Main Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-gold">TMARC</div>
            <button class="toggle-btn" id="sidebar-toggle">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
        </div>

        <div class="user-profile">
            <div class="user-avatar" id="userAvatar">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="user-info">
                <div class="user-name" id="userName">Cargando...</div>
                <div class="user-status"><span class="pulse-dot"></span> Online</div>
            </div>
        </div>

        <nav class="nav-menu">
            <!-- Dynamically generated items -->
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="top-bar glass-panel">
            <div class="search-bar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Buscar expedientes, notificaciones..." id="global-search">
            </div>
            <div class="top-actions">
                <button class="icon-btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></button>
                <div class="divider"></div>
                <button class="btn btn-primary btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div id="content-area" class="fade-in">
            <!-- Sections will be injected here -->
        </div>
    </main>

    <!-- Modal System -->
    <div class="modal-overlay" id="modalGeneral">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <span id="modalTitle">Detalles del Proceso</span>
                <button class="modal-close" onclick="closeAllModals()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be injected -->
            </div>
        </div>
    </div>

    <!-- Scripts Architecture -->
    <script src="assets/js/config/dashboard-config.js?v=7.0"></script>
    <script src="assets/js/dashboard-core.js?v=7.0"></script>
    <script src="assets/js/dashboard-sections.js?v=7.0"></script>
    
    <!-- Modules -->
    <script src="assets/js/modules/solicitudes.js?v=7.0"></script>
    <script src="assets/js/modules/notificaciones.js?v=7.0"></script>
    <script src="assets/js/modules/expedientes.js?v=7.0"></script>
    <script src="assets/js/modules/configuracion.js?v=7.0"></script>
    <script src="assets/js/modules/mesa-partes.js?v=7.0"></script>

    <script>
        // Initialize Core Engine
        document.addEventListener('DOMContentLoaded', () => {
            window.dashboardApp = new DashboardApp();
        });

        // Bridge functions
        function showSection(id, e) { window.dashboardApp.showSection(id, e); }
        function logout() { window.dashboardApp.logout(); }
        function closeAllModals() { window.dashboardApp.closeAllModals(); }
    </script>
</body>
</html>
